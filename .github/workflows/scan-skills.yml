name: Scan selected skills

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        skill:
          - chief-of-staff
          - agent-protocol

    env:
      SOURCE_COMMIT: f8593c4941210a621a6629ce1da9e07897976d5f
      SCANNER_COMMIT: a09091e0ebf6c96ff327457529d7b0d372125884
      SKILL_NAME: ${{ matrix.skill }}

    steps:
      - name: Install pinned scanner
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/scanner"
          "$RUNNER_TEMP/scanner/bin/pip" install \
            "git+https://github.com/NVIDIA/skillspector.git@$SCANNER_COMMIT"
          echo "$RUNNER_TEMP/scanner/bin" >> "$GITHUB_PATH"

      - name: Download selected source version
        shell: bash
        run: |
          git init candidate
          git -C candidate remote add origin \
            https://github.com/alirezarezvani/claude-skills.git
          git -C candidate fetch --depth=1 --filter=blob:none \
            origin "$SOURCE_COMMIT"
          git -C candidate sparse-checkout init --cone
          git -C candidate sparse-checkout set \
            "c-level-advisor/skills/$SKILL_NAME"
          git -C candidate checkout --detach FETCH_HEAD
          test "$(git -C candidate rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -f "candidate/c-level-advisor/skills/$SKILL_NAME/SKILL.md"

      - name: Record scan provenance
        shell: bash
        run: |
          mkdir -p results
          printf '%s\n' \
            "Source: https://github.com/alirezarezvani/claude-skills" \
            "Source commit: $SOURCE_COMMIT" \
            "Skill: c-level-advisor/skills/$SKILL_NAME" \
            "Scanner commit: $SCANNER_COMMIT" \
            "Mode: static only; AI analysis disabled" \
            "Review status: UNDER REVIEW; no installation approval" \
            > results/provenance.txt

      - name: Scan without running candidate code
        shell: bash
        run: |
          skillspector scan \
            "candidate/c-level-advisor/skills/$SKILL_NAME" \
            --no-llm \
            --fail-on-findings \
            --fail-on-incomplete \
            --format json \
            --output results/report.json

      - name: Preserve report even when checks fail
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: static-review-${{ matrix.skill }}
          path: results/
          if-no-files-found: warn
          retention-days: 7