name: Scan software program from chat

on:
  push:
    branches: [main]
    paths: ['.program-requests/*.json']
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique lowercase scan request ID
        required: true
        type: string
      repository_url:
        description: Public GitHub repository root URL
        required: true
        type: string
      ref:
        description: Branch, tag or commit to scan (HEAD means default)
        required: false
        default: HEAD
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      request_id: ${{ steps.request.outputs.request_id }}
      repository: ${{ steps.request.outputs.repository }}
      source_commit: ${{ steps.request.outputs.source_commit }}
    steps:
      - name: Checkout trusted scanner and new request
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate target and resolve immutable source commit
        id: request
        env:
          SOURCE_READ_TOKEN: ${{ github.token }}
          SCAN_REQUEST_ID: ${{ inputs.request_id }}
          SCAN_REPOSITORY_URL: ${{ inputs.repository_url }}
          SCAN_REF: ${{ inputs.ref }}
        run: python3 scripts/program_scan.py validate
      - name: Transfer verified request to independent scan jobs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: program-part-${{ github.run_id }}-request
          path: program-results/
          retention-days: 7

  codeql:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      status: ${{ steps.final.outputs.status }}
    steps:
      - name: Checkout trusted workflow
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout pinned public candidate as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.source_commit }}
          path: candidate
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Initialize static CodeQL
        id: init
        continue-on-error: true
        uses: github/codeql-action/init@v4
        with:
          languages: python,javascript-typescript
          build-mode: none
          config: |
            paths:
              - candidate/**
            queries:
              - uses: security-extended
      - name: Analyze static source without candidate build
        id: analyze
        if: steps.init.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          output: program-results/${{ needs.prepare.outputs.request_id }}/sarif
      - name: Record scanner status
        id: final
        if: always()
        env:
          INIT_OUTCOME: ${{ steps.init.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
        run: |
          if [ "$INIT_OUTCOME" = success ] && [ "$ANALYZE_OUTCOME" = success ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=incomplete" >> "$GITHUB_OUTPUT"
          fi
      - name: Save available CodeQL evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: program-part-${{ github.run_id }}-codeql
          path: program-results/
          if-no-files-found: ignore
          retention-days: 7

  osv:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      status: ${{ steps.osv.outputs.status }}
    steps:
      - name: Checkout trusted workflow
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout pinned public candidate as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.source_commit }}
          path: candidate
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Install official versioned OSV scanner, not candidate
        id: install
        continue-on-error: true
        run: |
          set -eu
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Analyze dependency inventories
        id: osv
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
        run: |
          mkdir -p "program-results/$REQUEST_ID"
          set +e
          osv-scanner scan source --format=json --output-file "program-results/$REQUEST_ID/osv.json" -r candidate
          code=$?
          if [ "$code" -eq 0 ]; then echo "status=success" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 1 ] && [ -s "program-results/$REQUEST_ID/osv.json" ]; then echo "status=findings" >> "$GITHUB_OUTPUT"
          else echo "status=incomplete" >> "$GITHUB_OUTPUT"; fi
      - name: Save dependency evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: program-part-${{ github.run_id }}-osv
          path: program-results/
          if-no-files-found: ignore
          retention-days: 7

  embedded_skills:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      status: ${{ steps.skills.outcome }}
    steps:
      - name: Checkout trusted workflow
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Checkout pinned public candidate as data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ needs.prepare.outputs.repository }}
          ref: ${{ needs.prepare.outputs.source_commit }}
          path: candidate
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Install pinned SkillSpector, not candidate
        id: install
        continue-on-error: true
        run: |
          python3 -m venv "$RUNNER_TEMP/embedded-skillspector"
          "$RUNNER_TEMP/embedded-skillspector/bin/pip" install "git+https://github.com/NVIDIA/skillspector.git@a09091e0ebf6c96ff327457529d7b0d372125884"
          echo "$RUNNER_TEMP/embedded-skillspector/bin" >> "$GITHUB_PATH"
      - name: Inspect bounded embedded SKILL.md instructions
        id: skills
        if: steps.install.outcome == 'success'
        continue-on-error: true
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
        run: python3 scripts/scan_embedded_skills.py
      - name: Save embedded skill evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: program-part-${{ github.run_id }}-skills
          path: program-results/
          if-no-files-found: ignore
          retention-days: 7

  aggregate:
    needs: [prepare, codeql, osv, embedded_skills]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      request_id: ${{ needs.prepare.outputs.request_id }}
    steps:
      - name: Checkout trusted report builders
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Retrieve all evidence for this exact run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          pattern: program-part-${{ github.run_id }}-*
          merge-multiple: true
          path: program-results
      - name: Record coverage and scanner failures
        env:
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          CODEQL_STATUS: ${{ needs.codeql.outputs.status }}
          OSV_STATUS: ${{ needs.osv.outputs.status }}
          EMBEDDED_STATUS: ${{ needs.embedded_skills.outputs.status }}
        run: |
          python3 scripts/program_scan.py summarize
          python3 scripts/program_triage.py
      - name: Preserve combined report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: program-final-${{ github.run_id }}
          path: program-results/${{ needs.prepare.outputs.request_id }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [prepare, aggregate]
    if: always() && needs.aggregate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout trusted publisher
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Download exact report
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: program-final-${{ github.run_id }}
          path: program-results/${{ needs.prepare.outputs.request_id }}
      - name: Publish report and register reusable result
        env:
          GH_TOKEN: ${{ github.token }}
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
        run: python3 scripts/chat_scan.py publish "program-results/$REQUEST_ID"
